<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeting Pipeline</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="page-header">
      <h1>Meeting Pipeline</h1>
      <p class="sub">
        Paste a transcript or a Loom link. The pipeline extracts decisions and action items,
        verifies every item against the transcript for receipts, and creates Jira tickets for
        human review. Optionally it also writes a strategy document to Confluence.
      </p>
    </header>

    <section class="card">
      <h2>New meeting</h2>
      <form id="meeting-form" class="form">
        <div class="row">
          <label>Meeting title
            <input id="f-title" type="text" placeholder="Weekly platform sync" required>
          </label>
          <label>Attendees <span class="hint">(comma separated)</span>
            <input id="f-attendees" type="text" placeholder="Danny, Sarah, Marcus">
          </label>
        </div>
        <label>Loom URL <span class="hint">(optional)</span>
          <input id="f-loom" type="url" placeholder="https://www.loom.com/share/...">
        </label>
        <label>Transcript
          <textarea id="f-transcript" rows="10" placeholder="Paste the meeting transcript here. Leave empty to fetch it from the Loom URL above, if transcript fetch is enabled."></textarea>
        </label>
        <label class="check">
          <input id="f-doc" type="checkbox">
          <span><strong>Also write a strategy document to Confluence.</strong>
          Executive summary, decisions with dissent, risks, action plan, and explicitly deferred items. A synthesis, not minutes.</span>
        </label>
        <div class="actions">
          <button type="submit" id="f-submit" class="primary">Run the pipeline</button>
          <button type="button" id="f-fixture" class="ghost">Load sample transcript</button>
        </div>
      </form>
      <div id="form-err" class="err"></div>
    </section>

    <div id="timeline"></div>
  </div>

  <script src="bundle.js"></script>
</body>
</html>
