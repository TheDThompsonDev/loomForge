modules:
  webtrigger:
    - key: transcript-ingest
      function: ingest-handler
      response:
        type: dynamic

  consumer:
    - key: pipeline-consumer
      queue: pipeline-queue
      function: pipeline-worker

  function:
    - key: ingest-handler
      handler: index.handleIngest
    - key: pipeline-worker
      handler: index.processPipelineJob
      timeoutSeconds: 120
    - key: fn-submit-transcript
      handler: actions.submitTranscript
    - key: action-get-job-status
      handler: actions.getJobStatus

  rovo:agent:
    - key: meeting-pipeline-agent
      name: Meeting Pipeline
      description: Captures an input, creates a Jira ticket, and can publish a
        Confluence page so the work is tracked.
      prompt: >
        You operate the meeting-pipeline app. When given an input (a meeting
        note, a research request, or similar), call submit-transcript to run
        the pipeline. Offer the Confluence option when the user wants a page
        written. Use get-job-status to report what a job created. Never claim
        a ticket or page exists unless a tool result says so. Tickets land in
        Review for human approval; always mention that.
      conversationStarters:
        - Capture this as a Jira ticket
        - Process this and write a Confluence page
        - What did my last pipeline job create?
      actions:
        - submit-transcript
        - get-job-status
  action:
    - key: submit-transcript
      function: fn-submit-transcript
      actionVerb: TRIGGER
      name: Submit captured input
      description: >
        Send captured input into the pipeline. A Jira ticket is created and
        stored on the job. Optionally also publishes a Confluence page.
        Returns the pipeline job id.
      inputs:
        transcript:
          title: Input
          type: string
          required: true
          description: The captured text (meeting notes, research request, or similar).
        meeting_title:
          title: Title
          type: string
          required: true
          description: Short title for the ticket.
        attendees:
          title: Attendees
          type: string
          required: false
          description: Comma-separated names, if any.
        date:
          title: Date
          type: string
          required: false
          description: Date, ISO-8601.
        generate_doc:
          title: Generate Confluence page
          type: string
          required: false
          description: Pass "true" to also publish a Confluence page.
    - key: get-job-status
      function: action-get-job-status
      actionVerb: GET
      name: Get pipeline job status
      description: >
        Check a pipeline job: current stage, the ticket created, and the
        Confluence page if one was written.
      inputs:
        job_id:
          title: Job id
          type: string
          required: true
          description: The job id returned by Submit captured input.

app:
  runtime:
    name: nodejs24.x
    memoryMB: 512
    architecture: arm64
  id: ari:cloud:ecosystem::app/0068d5d7-649b-4ada-b4d3-8b2650b68fe7

permissions:
  scopes:
    - read:jira-work
    - write:jira-work 
    - storage:app
    - read:space:confluence
    - write:page:confluence
