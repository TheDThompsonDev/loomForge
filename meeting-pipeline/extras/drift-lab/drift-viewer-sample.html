<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Drift Viewer — meeting-pipeline</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --text: #e6edf3; --dim: #8b949e;
    --naked: #f85149; --shelled: #3fb950; --accent: #58a6ff;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 28px; margin-bottom: 4px; }
  .sub { color: var(--dim); margin-bottom: 24px; }
  .loader { display: flex; gap: 12px; margin-bottom: 32px; }
  .loader input { flex: 1; padding: 12px 16px; font-size: 15px; background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 8px; }
  .loader button { padding: 12px 28px; font-size: 15px; font-weight: 600; background: var(--accent); color: #0d1117; border: 0; border-radius: 8px; cursor: pointer; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .set { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
  .set h2 { font-size: 20px; margin-bottom: 16px; }
  .set.naked h2 { color: var(--naked); }
  .set.shelled h2 { color: var(--shelled); }
  .bignums { display: flex; gap: 28px; flex-wrap: wrap; margin-bottom: 20px; }
  .bignum .v { font-size: 44px; font-weight: 700; line-height: 1.1; }
  .bignum .l { font-size: 13px; color: var(--dim); }
  .naked .bignum.hot .v { color: var(--naked); }
  .shelled .bignum.hot .v { color: var(--shelled); }
  svg { width: 100%; height: 260px; background: var(--bg); border-radius: 8px; margin-bottom: 20px; }
  .runs { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; max-height: 480px; overflow-y: auto; }
  .run { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-size: 13px; }
  .run .hd { display: flex; justify-content: space-between; margin-bottom: 8px; color: var(--dim); }
  .run ul { margin-left: 16px; }
  .run li { margin-bottom: 3px; }
  .badge { padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge.hall { background: rgba(248,81,73,.15); color: var(--naked); }
  .badge.drop { background: rgba(88,166,255,.15); color: var(--accent); }
  .verdict { margin-top: 12px; padding: 14px 18px; border-radius: 8px; font-size: 16px; font-weight: 600; }
  .naked .verdict { background: rgba(248,81,73,.12); color: var(--naked); }
  .shelled .verdict { background: rgba(63,185,80,.12); color: var(--shelled); }
  .err { color: var(--naked); margin-bottom: 16px; }
  .pending { color: var(--dim); font-style: italic; }
</style>
</head>

  <p class="sub">Same transcript. Same model. Left: no shell. Right: the pipeline. Each dot is one run; height is how many tickets it decided to create.</p>

  </div>
  <div id="err" class="err"></div>
  <div id="out"></div>

<script>
async function load() {
  const url = document.getElementById("url").value.trim();
  const err = document.getElementById("err");
  err.textContent = "";
  if (!url) { err.textContent = "Paste the compare URL first."; return; }
  // Offline backup path: the input accepts the raw compare JSON directly.
  if (url.startsWith("{")) {
    try { render(JSON.parse(url)); } catch (e) { err.textContent = "Bad JSON: " + e.message; }
    return;
  }
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    render(await res.json());
    localStorage.setItem("driftViewerUrl", url);
  } catch (e) {
    err.textContent = "Failed to load: " + e.message;
  }
}

function render(data) {
  const out = document.getElementById("out");
  out.innerHTML = `
    ${data.session.done ? "" : `<p class="pending">Still running: ${data.session.naked_complete}/${data.session.naked_requested} naked, ${data.session.shelled_complete}/${data.session.shelled_requested} shelled. Hit Load again to refresh.</p>`}
    <div class="cols">
      ${renderSet("naked", "Naked — one generic prompt, no rules", data.naked)}
      ${renderSet("shelled", "Shelled — schema gate + evidence check", data.shelled)}
    </div>`;
}

function renderSet(kind, title, set) {
  const m = set.set_metrics;
  if (!m) return `<div class="set ${kind}"><h2>${title}</h2><p class="pending">No completed runs yet.</p></div>`;
  const u = set.total_usage;
  const spread = m.item_count_max - m.item_count_min;
  const verdict = kind === "naked"
    ? `${m.runs} identical requests → ${m.distinct_ticket_sets} different ticket sets, ${m.total_hallucinated_fields} hallucinated fields`
    : (m.distinct_ticket_sets === 1
        ? `${m.runs} runs → 1 ticket set. Converged. Zero hallucinated fields survived the gate.`
        : `${m.runs} runs → ${m.distinct_ticket_sets} ticket sets, 0 hallucinated fields survived the gate`);
  return `
    <div class="set ${kind}">
      <h2>${title}</h2>
      <div class="bignums">
        <div class="bignum hot"><div class="v">${m.distinct_ticket_sets}</div><div class="l">distinct ticket sets</div></div>
        <div class="bignum"><div class="v">${m.item_count_min}–${m.item_count_max}</div><div class="l">tickets per run</div></div>
        <div class="bignum"><div class="v">σ ${m.item_count_stddev}</div><div class="l">std deviation</div></div>
        <div class="bignum hot"><div class="v">${m.total_hallucinated_fields}</div><div class="l">hallucinated fields</div></div>
        <div class="bignum"><div class="v">${m.total_owners_assigned}</div><div class="l">owners assigned</div></div>
      </div>
      ${scatter(kind, set.runs)}
      <div class="runs">${set.runs.map(runCard).join("")}</div>
      <div class="verdict">${verdict}</div>
      <p class="sub" style="margin-top:10px">${(u.total_tokens || 0).toLocaleString()} tokens · ${((u.total_latency_ms || 0) / 1000).toFixed(1)}s model time across ${m.runs} runs</p>
    </div>`;
}

function scatter(kind, runs) {
  const W = 560, H = 260, PAD = 36;
  const counts = runs.map(r => r.metrics ? r.metrics.action_item_count : 0);
  const maxY = Math.max(6, ...counts) + 1;
  const color = kind === "naked" ? "var(--naked)" : "var(--shelled)";
  const dots = runs.map((r, i) => {
    const n = r.metrics ? r.metrics.action_item_count : 0;
    const x = PAD + (i + 0.5) * ((W - PAD * 2) / Math.max(runs.length, 1));
    const y = H - PAD - (n / maxY) * (H - PAD * 2);
    const hall = r.metrics && r.metrics.hallucinated_fields ? r.metrics.hallucinated_fields.length : 0;
    return `<circle cx="${x}" cy="${y}" r="${7 + hall * 2}" fill="${color}" fill-opacity="0.75">
      <title>Run ${r.index + 1}: ${n} tickets${hall ? ", " + hall + " hallucinated fields" : ""}</title></circle>`;
  }).join("");
  const gridlines = [];
  for (let g = 0; g <= maxY; g += Math.ceil(maxY / 6)) {
    const y = H - PAD - (g / maxY) * (H - PAD * 2);
    gridlines.push(`<line x1="${PAD}" x2="${W - PAD}" y1="${y}" y2="${y}" stroke="var(--border)" stroke-dasharray="3 5"/>
      <text x="${PAD - 8}" y="${y + 4}" fill="var(--dim)" font-size="11" text-anchor="end">${g}</text>`);
  }
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    ${gridlines.join("")}${dots}
    <text x="${W / 2}" y="${H - 8}" fill="var(--dim)" font-size="11" text-anchor="middle">runs → (dot size grows with hallucinated fields)</text>
  </svg>`;
}

function runCard(r) {
  const m = r.metrics;
  const hall = m && m.hallucinated_fields ? m.hallucinated_fields.length : 0;
  const dropped = m && typeof m.dropped_by_evidence_gate === "number" ? m.dropped_by_evidence_gate : 0;
  return `<div class="run">
    <div class="hd"><span>Run ${r.index + 1}</span>
      <span>${r.error ? '<span class="badge hall">error</span>' : ""}
        ${hall ? `<span class="badge hall">${hall} hallucinated</span>` : ""}
        ${dropped ? `<span class="badge drop">${dropped} dropped by gate</span>` : ""}</span></div>
    ${r.error ? `<p>${escapeHtml(r.error)}</p>` : `<ul>${(m && m.item_summaries || []).map(s => `<li>${escapeHtml(s)}</li>`).join("")}</ul>`}
  </div>`;
}

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// Sample data: fetched from a sibling file when served over http, or baked
// in as window.SAMPLE_DATA (see drift-viewer-sample.html, which works by
// double-click with no server at all).
async function loadSample() {
  const err = document.getElementById("err");
  err.textContent = "";
  if (window.SAMPLE_DATA) { render(window.SAMPLE_DATA); return; }
  try {
    const res = await fetch("sample-comparison.json");
    if (!res.ok) throw new Error("HTTP " + res.status);
    render(await res.json());
  } catch (e) {
    err.textContent =
      "Couldn't fetch sample-comparison.json (opening as file:// blocks this) — " +
      "open drift-viewer-sample.html instead, or paste the JSON from demo/sample-comparison.json.";
  }
}

if (window.SAMPLE_DATA) {
  render(window.SAMPLE_DATA);
} else {
  const saved = localStorage.getItem("driftViewerUrl");
  if (saved) document.getElementById("url").value = saved;
}
</script>
